<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Game Deals — Live Price Comparison</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container" id="appContainer">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            <circle cx="7" cy="17" r="1"/>
            <circle cx="17" cy="17" r="1"/>
          </svg>
        </span>
        <span class="logo-text">PC Game Deals</span>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-section-title" id="priceSectionTitle">Price</h3>
        <div class="price-range">
          <input type="number" id="minPrice" placeholder="Min" min="0" step="1" aria-label="Minimum price">
          <span class="range-sep">–</span>
          <input type="number" id="maxPrice" placeholder="Max" min="0" step="1" aria-label="Maximum price">
        </div>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-section-title">Discount</h3>
        <div class="discount-options" role="radiogroup" aria-label="Discount filter">
          <label class="radio-label"><input type="radio" name="discount" value="all" checked> All games</label>
          <label class="radio-label"><input type="radio" name="discount" value="sale"> On sale</label>
          <label class="radio-label"><input type="radio" name="discount" value="none"> No discount</label>
        </div>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-section-title">Store</h3>
        <div class="store-options" id="storeOptions">
          <!-- Populated from API -->
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content-area">

      <!-- TOP NAVBAR -->
      <header class="top-navbar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="results-count" id="resultsCount">Loading deals…</div>

        <div class="navbar-actions">
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-6-6"/>
              </svg>
            </span>
            <input type="search" id="searchInput" placeholder="Search a game" aria-label="Search games">
            <button class="clear-search" id="clearSearch" aria-label="Clear search" hidden>✕</button>
          </div>

          <div class="view-toggle" role="group" aria-label="View mode">
            <button class="view-btn active" data-view="grid" aria-label="Grid view" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1" ry="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1" ry="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1" ry="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1" ry="1"/>
              </svg>
            </button>
            <button class="view-btn" data-view="list" aria-label="List view" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
          </div>

          <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-moon theme-icon">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-sun theme-icon">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- FILTER SUBBAR -->
      <div class="filter-subbar">
        <div class="sort-wrapper">
          <label for="sortSelect" class="sr-only">Sort by</label>
          <select id="sortSelect" class="sort-select">
            <option value="discount">Discount</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="title">Name A–Z</option>
          </select>
        </div>
      </div>

      <!-- STATUS BANNER (API error / fallback) -->
      <div class="status-banner" id="statusBanner" hidden></div>

      <!-- SUMMARY -->
      <section class="summary-section" id="summarySection" aria-live="polite"></section>

      <!-- GAME GRID -->
      <div class="game-grid-container" id="gameGrid" role="list"></div>

      <!-- EMPTY STATE -->
      <div class="empty-state" id="emptyState" hidden>
        <p class="empty-icon" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            <circle cx="7" cy="17" r="1"/>
            <circle cx="17" cy="17" r="1"/>
          </svg>
        </p>
        <p class="empty-text">No games found. Try changing your search or filters.</p>
        <button class="reset-btn" id="resetFiltersBtn">Reset filters</button>
      </div>

      <!-- LOADING -->
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>Fetching live deals…</p>
      </div>

    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
